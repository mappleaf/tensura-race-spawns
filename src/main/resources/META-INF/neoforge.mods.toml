modLoader="javafml"
loaderVersion="[4,)"
displayTest="IGNORE_SERVER_VERSION"
license="MIT"
issueTrackerURL="https://github.com/mappleaf/tensura-race-spawns/issues"

[[mixins]]
config="tensuraracespawns.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="tensura"
type="required"
versionRange="[2.0.1.0,)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="asynclocator"
type="optional"
versionRange="[1.0,)"
ordering="AFTER"
side="SERVER"
